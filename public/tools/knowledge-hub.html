<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon运营中台 - 知识库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/js/api.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', 'Microsoft YaHei', sans-serif; }
    .sidebar-item { transition: all 0.2s ease; }
    .sidebar-item:hover, .sidebar-item.active {
      background: rgba(59, 130, 246, 0.1); color: #2563eb; border-right: 3px solid #2563eb;
    }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .tag { transition: all 0.2s; }
    .tag:hover { transform: scale(1.05); }
    .doc-card { transition: all 0.2s; border: 1px solid transparent; }
    .doc-card:hover { border-color: #e5e7eb; background: #f9fafb; }
    .folder-item { transition: all 0.15s; }
    .folder-item:hover, .folder-item.active { background: #eff6ff; color: #2563eb; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white border-r border-gray-200 z-50 transition-transform duration-300">
    <div class="flex items-center justify-between p-5 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center">
          <i class="fas fa-cube text-white text-sm"></i>
        </div>
        <div>
          <h1 class="font-bold text-gray-900 text-sm">Amazon运营中台</h1>
          <p class="text-xs text-gray-500">Operations Hub</p>
        </div>
      </div>
      <button id="sidebarToggle" class="lg:hidden text-gray-500 hover:text-gray-700">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <nav class="py-4 overflow-y-auto h-[calc(100%-80px)] scrollbar-hide">
      <div class="px-4 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">核心模块</div>
      <a href="index.html" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700">
        <i class="fas fa-chart-pie w-5 text-center"></i><span>Dashboard</span>
      </a>
      <a href="knowledge-hub.html" class="sidebar-item active flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700">
        <i class="fas fa-book w-5 text-center"></i><span>知识库</span>
      </a>
      <a href="asin-workbench.html" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700">
        <i class="fas fa-barcode w-5 text-center"></i><span>ASIN工作台</span>
      </a>
      <a href="task-hub.html" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700">
        <i class="fas fa-tasks w-5 text-center"></i><span>任务中心</span>
        <span id="taskBadge" class="ml-auto bg-red-500 text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
      </a>
      <div class="px-4 mt-6 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">智能运营</div>
      <a href="agent-workbench.html" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700">
        <i class="fas fa-robot w-5 text-center"></i><span>Agent工作台</span>
        <span class="ml-auto bg-purple-100 text-purple-600 text-xs px-2 py-0.5 rounded">AI</span>
      </a>
      <div class="px-4 mt-6 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">流程管理</div>
      <a href="approval-center.html" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700">
        <i class="fas fa-check-circle w-5 text-center"></i><span>审批中心</span>
        <span id="approvalBadge" class="ml-auto bg-orange-500 text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
      </a>
      <a href="exception-center.html" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700">
        <i class="fas fa-exclamation-triangle w-5 text-center"></i><span>异常中心</span>
        <span id="exceptionBadge" class="ml-auto bg-red-500 text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
      </a>
      <a href="review-center.html" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700">
        <i class="fas fa-history w-5 text-center"></i><span>复盘中心</span>
      </a>
      <div class="px-4 mt-6 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">系统</div>
      <a href="settings.html" class="sidebar-item flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700">
        <i class="fas fa-cog w-5 text-center"></i><span>系统设置</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="lg:ml-64 min-h-screen">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
      <div class="flex items-center justify-between px-6 py-3">
        <div class="flex items-center gap-4">
          <button id="mobileMenuBtn" class="lg:hidden text-gray-500 hover:text-gray-700">
            <i class="fas fa-bars text-lg"></i>
          </button>
          <h2 class="text-lg font-semibold text-gray-800">知识库</h2>
        </div>
        <div class="flex items-center gap-4">
          <div class="relative hidden md:block">
            <input type="text" id="globalSearch" placeholder="搜索知识文档..."
              class="w-64 pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          </div>
          <button class="relative p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg">
            <i class="fas fa-bell"></i>
            <span id="notifBadge" class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full hidden"></span>
          </button>
          <div class="flex items-center gap-3 pl-4 border-l border-gray-200">
            <div class="text-right hidden sm:block">
              <p class="text-sm font-medium text-gray-800">运营管理员</p>
              <p class="text-xs text-gray-500">admin@amazon.com</p>
            </div>
            <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white font-semibold text-sm">A</div>
          </div>
        </div>
      </div>
    </header>

    <div class="p-6">
      <!-- Toolbar -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-3">
          <div class="relative">
            <input type="text" id="docSearch" placeholder="搜索文档..."
              class="w-72 pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          </div>
          <select id="sortSelect" class="px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="newest">最新创建</option>
            <option value="updated">最近更新</option>
            <option value="name">名称排序</option>
          </select>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="openModal('folderModal')" class="px-4 py-2.5 bg-gray-100 text-gray-700 rounded-xl text-sm font-medium hover:bg-gray-200 transition-colors">
            <i class="fas fa-folder-plus mr-2"></i>新建分类
          </button>
          <button onclick="openModal('docModal')" class="px-4 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-medium hover:bg-blue-700 transition-colors">
            <i class="fas fa-plus mr-2"></i>新建文档
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <!-- Folder Sidebar -->
        <div class="lg:col-span-1">
          <div class="bg-white rounded-xl border border-gray-200 p-4">
            <h4 class="font-semibold text-gray-800 mb-3 text-sm">文档分类</h4>
            <div id="folderList" class="space-y-1">
              <!-- Folders rendered by JS -->
            </div>
            <div class="mt-4 pt-4 border-t border-gray-100">
              <h4 class="font-semibold text-gray-800 mb-3 text-sm">热门标签</h4>
              <div id="tagCloud" class="flex flex-wrap gap-2">
                <!-- Tags rendered by JS -->
              </div>
            </div>
          </div>
        </div>

        <!-- Document Grid -->
        <div class="lg:col-span-3">
          <div class="bg-white rounded-xl border border-gray-200 p-5 min-h-[500px]">
            <div class="flex items-center justify-between mb-4">
              <h4 class="font-semibold text-gray-800" id="currentFolderTitle">全部文档</h4>
              <span class="text-sm text-gray-500" id="docCount">0 篇文档</span>
            </div>
            <div id="docGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
              <!-- Documents rendered by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="border-t border-gray-200 py-4 px-6 mt-8">
      <p class="text-center text-xs text-gray-400">Amazon运营中台 v1.0 | 数据仅供参考，请以卖家后台为准</p>
    </footer>
  </main>

  <!-- New Doc Modal -->
  <div id="docModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center">
    <div class="bg-white rounded-2xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between p-5 border-b border-gray-100">
        <h3 class="font-semibold text-gray-800">新建知识文档</h3>
        <button onclick="closeModal('docModal')" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-5 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">文档标题</label>
          <input type="text" id="newDocTitle" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入文档标题">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">分类</label>
            <select id="newDocFolder" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">标签 (逗号分隔)</label>
            <input type="text" id="newDocTags" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例如: 广告, PPC, 优化">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">文档内容</label>
          <textarea id="newDocContent" rows="10" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" placeholder="支持 Markdown 格式输入..."></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-3 p-5 border-t border-gray-100">
        <button onclick="closeModal('docModal')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">取消</button>
        <button onclick="saveDoc()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存文档</button>
      </div>
    </div>
  </div>

  <!-- New Folder Modal -->
  <div id="folderModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center">
    <div class="bg-white rounded-2xl w-full max-w-md mx-4">
      <div class="flex items-center justify-between p-5 border-b border-gray-100">
        <h3 class="font-semibold text-gray-800">新建分类</h3>
        <button onclick="closeModal('folderModal')" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">分类名称</label>
        <input type="text" id="newFolderName" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入分类名称">
      </div>
      <div class="flex justify-end gap-3 p-5 border-t border-gray-100">
        <button onclick="closeModal('folderModal')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">取消</button>
        <button onclick="saveFolder()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">创建</button>
      </div>
    </div>
  </div>

  <!-- View Doc Modal -->
  <div id="viewModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center">
    <div class="bg-white rounded-2xl w-full max-w-3xl mx-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between p-5 border-b border-gray-100">
        <div>
          <h3 class="font-semibold text-gray-800" id="viewDocTitle"></h3>
          <p class="text-xs text-gray-500 mt-1" id="viewDocMeta"></p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="deleteCurrentDoc()" class="p-2 text-red-500 hover:bg-red-50 rounded-lg"><i class="fas fa-trash"></i></button>
          <button onclick="closeModal('viewModal')" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <div class="p-5">
        <div id="viewDocTags" class="flex flex-wrap gap-2 mb-4"></div>
        <div id="viewDocContent" class="prose max-w-none text-gray-700 leading-relaxed whitespace-pre-wrap"></div>
      </div>
    </div>
  </div>

  <script>
    requireAuth();

    // ===================== STATE =====================
    let folders = [];
    let docs = [];
    let currentFolder = 'all';
    let currentDocId = null;
    let searchQuery = '';

    async function loadData() {
      try {
        const [fRes, dRes] = await Promise.all([
          OpsAPI.list('folders'),
          OpsAPI.list('docs')
        ]);
        folders = (fRes.data || []).map(f => ({ ...f, id: f.folder_id || f.id }));
        docs = (dRes.data || []).map(d => ({ ...d, folder: d.folder_id || d.folder, updatedAt: d.updated_at || d.updatedAt || new Date().toISOString() }));
      } catch (e) {
        console.error('加载数据失败', e);
        alert('加载数据失败');
      }
    }

    // ===================== RENDER =====================
    function renderFolders() {
      const list = document.getElementById('folderList');
      let html = `<div class="folder-item ${currentFolder==='all'?'active':''} flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer" onclick="setFolder('all')">
        <i class="fas fa-folder-open w-5 text-center text-gray-400"></i><span class="text-sm">全部文档</span><span class="ml-auto text-xs text-gray-400">${docs.length}</span></div>`;
      folders.forEach(f => {
        const count = docs.filter(d => d.folder === f.id).length;
        html += `<div class="folder-item ${currentFolder===f.id?'active':''} flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer" onclick="setFolder('${f.id}')">
          <i class="fas ${f.icon} w-5 text-center text-gray-400"></i><span class="text-sm">${f.name}</span><span class="ml-auto text-xs text-gray-400">${count}</span></div>`;
      });
      list.innerHTML = html;
    }

    function renderTags() {
      const allTags = [...new Set(docs.flatMap(d => d.tags || []))];
      const cloud = document.getElementById('tagCloud');
      cloud.innerHTML = allTags.map(t =>
        `<span class="tag px-3 py-1 bg-blue-50 text-blue-600 text-xs rounded-full cursor-pointer hover:bg-blue-100" onclick="filterByTag('${t}')">${t}</span>`
      ).join('');
    }

    function renderDocs() {
      const grid = document.getElementById('docGrid');
      let filtered = docs;
      if (currentFolder !== 'all') filtered = filtered.filter(d => d.folder === currentFolder);
      if (searchQuery) filtered = filtered.filter(d => d.title.includes(searchQuery) || d.content.includes(searchQuery) || (d.tags||[]).some(t=>t.includes(searchQuery)));

      document.getElementById('currentFolderTitle').textContent = currentFolder === 'all' ? '全部文档' : (folders.find(f=>f.id===currentFolder)?.name || '未知分类');
      document.getElementById('docCount').textContent = `${filtered.length} 篇文档`;

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-12">暂无文档</div>';
        return;
      }

      grid.innerHTML = filtered.map(d => {
        const folderName = folders.find(f=>f.id===d.folder)?.name || '未分类';
        const date = new Date(d.updatedAt).toLocaleDateString('zh-CN');
        return `
          <div class="doc-card bg-gray-50 rounded-xl p-4 cursor-pointer" onclick="viewDoc(${d.id})">
            <div class="flex items-start justify-between mb-3">
              <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
                <i class="fas fa-file-alt text-blue-600"></i>
              </div>
              <span class="text-xs text-gray-400">${date}</span>
            </div>
            <h5 class="font-medium text-gray-800 mb-2 line-clamp-1">${d.title}</h5>
            <p class="text-xs text-gray-500 line-clamp-2 mb-3">${d.content.substring(0,80)}...</p>
            <div class="flex items-center justify-between">
              <span class="text-xs px-2 py-1 bg-white rounded text-gray-600">${folderName}</span>
              <div class="flex gap-1">
                ${(d.tags||[]).slice(0,2).map(t=>`<span class="text-xs px-2 py-0.5 bg-blue-50 text-blue-600 rounded">${t}</span>`).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function populateFolderSelect() {
      const sel = document.getElementById('newDocFolder');
      sel.innerHTML = folders.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
    }

    // ===================== ACTIONS =====================
    function setFolder(id) { currentFolder = id; renderFolders(); renderDocs(); }
    function filterByTag(tag) { document.getElementById('docSearch').value = tag; searchQuery = tag; renderDocs(); }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

    async function saveDoc() {
      const title = document.getElementById('newDocTitle').value.trim();
      const folder = document.getElementById('newDocFolder').value;
      const tags = document.getElementById('newDocTags').value.split(',').map(t=>t.trim()).filter(Boolean);
      const content = document.getElementById('newDocContent').value.trim();
      if (!title || !content) { alert('请填写标题和内容'); return; }
      try {
        const payload = { title, folder_id: folder, tags, content, updatedAt: new Date().toISOString() };
        const res = await OpsAPI.create('docs', payload);
        const newDoc = { ...res, folder: res.folder_id || res.folder || folder, updatedAt: res.updated_at || res.updatedAt || new Date().toISOString() };
        docs.unshift(newDoc);
        renderFolders(); renderDocs(); renderTags(); closeModal('docModal');
        document.getElementById('newDocTitle').value = ''; document.getElementById('newDocTags').value = ''; document.getElementById('newDocContent').value = '';
      } catch (e) {
        alert('保存文档失败: ' + e.message);
      }
    }

    async function saveFolder() {
      const name = document.getElementById('newFolderName').value.trim();
      if (!name) return;
      try {
        const folder_id = 'f' + Date.now();
        const payload = { folder_id, name, icon: 'fa-folder' };
        const res = await OpsAPI.create('folders', payload);
        const newFolder = { ...res, id: res.folder_id || folder_id };
        folders.push(newFolder);
        renderFolders(); populateFolderSelect(); closeModal('folderModal');
        document.getElementById('newFolderName').value = '';
      } catch (e) {
        alert('创建分类失败: ' + e.message);
      }
    }

    function viewDoc(id) {
      const d = docs.find(x=>x.id===id); if (!d) return;
      currentDocId = id;
      document.getElementById('viewDocTitle').textContent = d.title;
      document.getElementById('viewDocMeta').textContent = `更新于 ${new Date(d.updatedAt).toLocaleString('zh-CN')} | ${folders.find(f=>f.id===d.folder)?.name||'未分类'}`;
      document.getElementById('viewDocTags').innerHTML = (d.tags||[]).map(t=>`<span class="px-2 py-1 bg-blue-50 text-blue-600 text-xs rounded-full">${t}</span>`).join('');
      document.getElementById('viewDocContent').textContent = d.content;
      openModal('viewModal');
    }

    async function deleteCurrentDoc() {
      if (!confirm('确定删除此文档？')) return;
      try {
        await OpsAPI.remove('docs', currentDocId);
        docs = docs.filter(d=>d.id!==currentDocId);
        renderFolders(); renderDocs(); renderTags(); closeModal('viewModal');
      } catch (e) {
        alert('删除文档失败: ' + e.message);
      }
    }

    // ===================== SEARCH =====================
    document.getElementById('docSearch')?.addEventListener('input', e => { searchQuery = e.target.value; renderDocs(); });
    document.getElementById('globalSearch')?.addEventListener('input', e => { searchQuery = e.target.value; renderDocs(); });

    // ===================== MOBILE SIDEBAR =====================
    function initSidebar() {
      const sidebar = document.getElementById('sidebar');
      document.getElementById('sidebarToggle')?.addEventListener('click', () => sidebar.classList.add('-translate-x-full'));
      document.getElementById('mobileMenuBtn')?.addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
      document.addEventListener('click', e => { if (window.innerWidth<1024 && !sidebar.contains(e.target) && !document.getElementById('mobileMenuBtn')?.contains(e.target)) sidebar.classList.add('-translate-x-full'); });
      if (window.innerWidth<1024) sidebar.classList.add('-translate-x-full');
    }

    // ===================== INIT =====================
    document.addEventListener('DOMContentLoaded', async () => {
      await loadData();
      renderFolders(); renderTags(); renderDocs(); populateFolderSelect(); initSidebar(); updateBadges();
    });
  </script>
</body>
</html>
