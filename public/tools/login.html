<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon运营中台 - 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', 'Microsoft YaHei', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-700 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-cube text-white text-xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Amazon运营中台</h1>
      <p class="text-sm text-gray-500 mt-1">SaaS 云端版</p>
    </div>

    <div id="loginForm">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
          <input type="text" id="username" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入用户名">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
          <input type="password" id="password" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入密码">
        </div>
        <div id="errorMsg" class="text-sm text-red-600 hidden"></div>
        <button onclick="handleLogin()" id="loginBtn" class="w-full py-2.5 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 transition-colors">
          登录
        </button>
        <button onclick="handleRegister()" id="registerBtn" class="w-full py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl font-medium hover:bg-gray-50 transition-colors">
          注册账号
        </button>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">数据安全存储于 Cloudflare D1</p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (OpsAPI.auth.isLoggedIn()) window.location.href = '/index.html';

    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');
      if (!username || !password) { errEl.textContent = '请填写用户名和密码'; errEl.classList.remove('hidden'); return; }
      btn.disabled = true; btn.textContent = '登录中...';
      try {
        await OpsAPI.auth.login(username, password);
        window.location.href = '/index.html';
      } catch (e) {
        errEl.textContent = e.message; errEl.classList.remove('hidden');
        btn.disabled = false; btn.textContent = '登录';
      }
    }

    async function handleRegister() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('errorMsg');
      const btn = document.getElementById('registerBtn');
      if (!username || !password) { errEl.textContent = '请填写用户名和密码'; errEl.classList.remove('hidden'); return; }
      if (password.length < 6) { errEl.textContent = '密码至少6位'; errEl.classList.remove('hidden'); return; }
      btn.disabled = true; btn.textContent = '注册中...';
      try {
        await OpsAPI.auth.register(username, password);
        window.location.href = '/index.html';
      } catch (e) {
        errEl.textContent = e.message; errEl.classList.remove('hidden');
        btn.disabled = false; btn.textContent = '注册账号';
      }
    }

    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>
